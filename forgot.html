<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>忘记密码 · 火星极客 Mars Geek</title>
<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
<canvas id="stars"></canvas>
<div class="mars-glow"></div>
<div class="wrap">
  <div class="brand">
    <a href="index.html"><div class="logo"></div>
    <h1>火星极客<span class="en">MARS GEEK · 后台</span></h1></a>
  </div>
  <div class="card">
    <h2>忘记密码</h2>
    <p class="sub">输入注册邮箱，我们会发送一封包含重置链接的邮件（30 分钟内有效）</p>
    <form id="forgotForm" novalidate>
      <div class="alert"></div>
      <div class="field" data-field="email">
        <label for="email">注册邮箱</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" autofocus>
        <div class="ferr"></div>
      </div>
      <button class="btn" id="submitBtn" type="submit"><span class="spinner"></span><span class="btn-text">发送重置邮件</span></button>
    </form>
    <div class="links">
      想起密码了？<a href="login.html">返回登录</a>
    </div>
  </div>
  <div class="back-home"><a href="index.html">← 返回品牌官网</a></div>
</div>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script>
(function () {
  'use strict';
  const form = document.getElementById('forgotForm');
  const btn = document.getElementById('submitBtn');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    AuthUI.clearErrors(form);
    const email = form.email.value.trim();
    if (!email) {
      AuthUI.applyApiError(form, { message: '请输入邮箱', details: { email: '请输入邮箱' } });
      return;
    }
    await AuthUI.withLoading(btn, async () => {
      try {
        const data = await MG.post('/api/auth/forgot-password', { email });
        AuthUI.showAlert(form, 'success', data.message || '重置邮件已发送，请查收');
        form.email.value = '';
      } catch (err) {
        AuthUI.applyApiError(form, err);
      }
    });
  });
})();
</script>
</body>
</html>
