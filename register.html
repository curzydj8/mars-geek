<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 · 火星极客 Mars Geek</title>
<meta name="description" content="注册火星极客账户">
<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
<canvas id="stars"></canvas>
<div class="mars-glow"></div>
<div class="wrap">
  <div class="brand">
    <a href="index.html"><div class="logo"></div>
    <h1>火星极客<span class="en">MARS GEEK · 后台</span></h1></a>
  </div>
  <div class="card">
    <h2>创建账户</h2>
    <p class="sub">注册后自动登录，立即进入后台</p>
    <form id="regForm" novalidate>
      <div class="alert"></div>
      <div class="field" data-field="email">
        <label for="email">邮箱</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" autofocus>
        <div class="ferr"></div>
      </div>
      <div class="field" data-field="username">
        <label for="username">用户名</label>
        <input id="username" name="username" type="text" placeholder="2-24 位字母/数字/下划线/中文" autocomplete="username">
        <div class="ferr"></div>
      </div>
      <div class="field" data-field="password">
        <label for="password">密码</label>
        <div class="pw-wrap">
          <input id="password" name="password" type="password" placeholder="至少 8 位，含 3 种字符类型" autocomplete="new-password">
          <button type="button" class="pw-toggle">显示</button>
        </div>
        <div class="strength"><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="lbl"></span></div>
        <div class="ferr"></div>
      </div>
      <div class="field" data-field="confirmPassword">
        <label for="confirm">确认密码</label>
        <input id="confirm" name="confirmPassword" type="password" placeholder="再次输入密码" autocomplete="new-password">
        <div class="ferr"></div>
      </div>
      <button class="btn" id="submitBtn" type="submit"><span class="spinner"></span><span class="btn-text">注 册</span></button>
    </form>
    <div class="links">
      已有账户？<a href="login.html">直接登录</a>
    </div>
  </div>
  <div class="back-home"><a href="index.html">← 返回品牌官网</a></div>
</div>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script>
(function () {
  'use strict';
  AuthUI.bindPwToggle();
  AuthUI.bindStrength('password');
  const form = document.getElementById('regForm');
  const btn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    AuthUI.clearErrors(form);
    const body = {
      email: form.email.value.trim(),
      username: form.username.value.trim(),
      password: form.password.value,
      confirmPassword: form.confirm.value,
    };
    if (body.password !== body.confirmPassword) {
      AuthUI.applyApiError(form, { message: '两次输入的密码不一致', details: { confirmPassword: '两次输入的密码不一致' } });
      return;
    }
    await AuthUI.withLoading(btn, async () => {
      try {
        const data = await MG.post('/api/auth/register', body);
        MG.setToken(data.accessToken);
        AuthUI.showAlert(form, 'success', '注册成功，正在进入后台…');
        setTimeout(() => { location.href = '/admin/'; }, 800);
      } catch (err) {
        AuthUI.applyApiError(form, err);
      }
    });
  });
})();
</script>
</body>
</html>
